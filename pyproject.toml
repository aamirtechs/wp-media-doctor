[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-media-doctor"
version = "1.0.0"
description = "Audit a WordPress media library CSV export: missing or weak alt text, oversized originals, duplicate files, unused images, unsupported formats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
wp-media-doctor = "wp_media_doctor:main_entry"

[tool.setuptools]
py-modules = ["wp_media_doctor"]
